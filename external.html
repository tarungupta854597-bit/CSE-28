<!DOCTYPE html>
<html>
<head>
     <title>navigation menu</title>
<style>
   body{
   margin :0;
   font-family:arial;
   }
   .header{
    background:black;
    color:white;
    padding:15px;
    text-align:center;
    }
   .navbar{
    background:blue;
    overflow:hidden;
    }
    .navbar a{
    float:left;
    color:white;
    padding:14px 20px;
     text-decoration:none;
    }
    .menu-inline{
    text-align:center;
    background:15px;
    }
   .menu-inline a {
    display:inline-black;
    background:white;
    padding:10px 18px;
    margin:5px;
    border-radius:5px;
    }
    .content{
    display:block;
    padding:20px;
    }
    .box{
    display:inline-block;
    width:30%;
    background:block;
    padding :15px;
    margin:10px;
    }
   .clear-fix{
   clear:both;
   }
</style>
</head>
<body>
      <div class="header">
         <h2>Navigation Manu</h2>
      </div>
      <div class="navbar">
         <a href="#">Home</a>
         <a href="#">About</a>
         <a href="#">content</a>
         <a href="#">placement</a>
         <a href="#">admission</a>
      </div>
      <div class="menu-inline">
         <a href="#">profile</a>
         <a href="#">gallery</a>
         <a href="#">support</a>
         <a href="#">youtube</a>
      </div>
      <div class="content">
<a href="box">write</a>
</div>
</body>
</html>
